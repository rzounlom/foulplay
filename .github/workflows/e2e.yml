name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "lib/e2e/**"
      - "app/api/e2e/**"

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUN_E2E == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_E2E }}

      - name: Run E2E
        run: npm run test:e2e:ci
        env:
          APP_ENV: test
          CI: "1"
          DATABASE_URL_E2E: ${{ secrets.DATABASE_URL_E2E }}
          DIRECT_DATABASE_URL_E2E: ${{ secrets.DIRECT_DATABASE_URL_E2E }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_PASSWORD: ${{ secrets.E2E_CLERK_PASSWORD }}
          E2E_TEST_TOKEN: ${{ secrets.E2E_TEST_TOKEN }}
          ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}
          NEXT_PUBLIC_ABLY_API_KEY: ${{ secrets.NEXT_PUBLIC_ABLY_API_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          E2E_BASE_URL: http://localhost:3100
          AUTO_ACCEPT_SECONDS_E2E: "5"
          INTERMISSION_SECONDS_E2E: "8"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
